# Mi Cancha - Docker Compose Configuration
# Services: FastAPI Backend + Next.js Portals (Web, Admin, Public)
# Usage: docker compose up -d --build

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: micancha-backend
    ports:
      - "8002:8001"
    environment:
      - PORT=8001
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
      - ./backend/logs:/app/logs
      - ./backend/static/uploads:/app/static/uploads
    restart: unless-stopped
    networks:
      - micancha-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8001/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://187.77.247.23:8002
    container_name: micancha-web
    ports:
      - "3000:3000"
    restart: unless-stopped
    networks:
      - micancha-network
    depends_on:
      - backend

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    container_name: micancha-admin
    ports:
      - "3001:3000"
    restart: unless-stopped
    networks:
      - micancha-network
    depends_on:
      - backend

  public:
    build:
      context: ./public
      dockerfile: Dockerfile
    container_name: micancha-public
    ports:
      - "3002:3000"
    restart: unless-stopped
    networks:
      - micancha-network
    depends_on:
      - backend

networks:
  micancha-network:
    driver: bridge
