# Mi Cancha - Docker Compose Configuration
# Services: FastAPI Backend + Next.js Portals (Web, Admin, Public)
# Usage: docker compose up -d --build

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: micancha-backend
    ports:
      - "8002:8001"
    environment:
      - PORT=8001
      - GOOGLE_CLIENT_ID=439455345371-dkvgmnbcvf4l5vcsukmm8io273mkk4ab.apps.googleusercontent.com
      - EVOLUTION_API_URL=http://evolution-api:8080
      - EVOLUTION_API_KEY=micancha_whatsapp_secret_2026
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
      - ./backend/logs:/app/logs
      - ./backend/static/uploads:/app/static/uploads
    restart: unless-stopped
    networks:
      - micancha-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8001/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-https://api.micancha.com.py}
        - NEXT_PUBLIC_GOOGLE_CLIENT_ID=439455345371-dkvgmnbcvf4l5vcsukmm8io273mkk4ab.apps.googleusercontent.com
    container_name: micancha-web
    ports:
      - "3000:3000"
    restart: unless-stopped
    networks:
      - micancha-network
    depends_on:
      - backend

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-https://api.micancha.com.py}
    container_name: micancha-admin
    ports:
      - "3001:3000"
    restart: unless-stopped
    networks:
      - micancha-network
    depends_on:
      - backend

  public:
    build:
      context: ./public
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-https://api.micancha.com.py}
    container_name: micancha-public
    ports:
      - "3002:3000"
    restart: unless-stopped
    networks:
      - micancha-network
    depends_on:
      - backend

  db:
    image: postgis/postgis:15-3.3-alpine
    container_name: micancha-db-local
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: BBDD_micancha
    ports:
      - "5436:5432"
    volumes:
      - postgres_data_local:/var/lib/postgresql/data
    networks:
      - micancha-network

  evolution-api:
    image: evoapicloud/evolution-api:latest
    container_name: evolution-api
    restart: always
    environment:
      - SERVER_TYPE=http
      - SERVER_PORT=8080
      - SERVER_URL=http://evolution-api:8080
      - AUTHENTICATION_TYPE=apikey
      - AUTHENTICATION_API_KEY=micancha_whatsapp_secret_2026
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://postgres:admin@db:5432/BBDD_micancha?schema=evolution
      - DATABASE_CONNECTION_CLIENT_NAME=evolution_v2
      - DEL_INSTANCE=false
    volumes:
      - evolution_instances:/evolution/instances
    networks:
      - micancha-network


volumes:
  postgres_data_local:
  evolution_instances:

networks:
  micancha-network:
    driver: bridge
