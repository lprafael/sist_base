services:
  # ── Base de Datos (PostgreSQL) ─────────────────────
  db:
    image: postgres:15-alpine
    container_name: sgs-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sgs_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sgs_pass_prod_2024}
      POSTGRES_DB: ${POSTGRES_DB:-sgs_db}
    ports:
      - "5435:5432"   # Puerto 5435 para no chocar con SIGEL (5434)
    volumes:
      - sgs_pgdata_prod:/var/lib/postgresql/data
    networks:
      - sgs-prod-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sgs_user} -d ${POSTGRES_DB:-sgs_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend FastAPI ────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sgs-backend
    ports:
      - "8003:8001"   # Puerto 8003 para no chocar con SIGEL (8002)
    env_file:
      - .env
    environment:
      - PORT=8001
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/logs:/app/logs
    networks:
      - sgs-prod-network
    restart: unless-stopped

  # ── Frontend React/Nginx ───────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_REACT_APP_API_URL=/api
        - VITE_GOOGLE_CLIENT_ID=${VITE_GOOGLE_CLIENT_ID}
    container_name: sgs-frontend
    ports:
      - "3003:80"     # Puerto 3003 para no chocar con SIGEL (3002)
    depends_on:
      - backend
    networks:
      - sgs-prod-network
    restart: unless-stopped

networks:
  sgs-prod-network:
    driver: bridge

volumes:
  sgs_pgdata_prod:
    name: sgs_pgdata_prod
