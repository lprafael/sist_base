# Backend (FastAPI) + Frontend (Nginx). La base de datos es externa (local en el host).
# Uso: docker compose up -d
# Frontend: http://localhost:3002  |  API: http://localhost:8002

services:
  db:
    image: postgres:15-alpine
    container_name: mi-playa-db
    environment:
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres}
      - POSTGRES_DB=${DB_NAME:-mi_playa}
    volumes:
      - mi_playa_db_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - mi-playa-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-mi_playa}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mi-playa-backend
    ports:
      - "8004:8001"
    environment:
      - PORT=8001
      - DATABASE_URL=postgresql+asyncpg://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:5432/${DB_NAME:-mi_playa}
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./backend/logs:/app/logs
      - ./backend/static/uploads:/app/static/uploads
    restart: unless-stopped
    networks:
      - mi-playa-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8001/backup/ping" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mi-playa-frontend
    ports:
      - "3004:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - mi-playa-network
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/" ]
      interval: 30s
      timeout: 10s
      retries: 3

  public-catalog:
    build:
      context: ./frontend/public-catalog
      dockerfile: Dockerfile
      args:
        # URL de la API vista desde el navegador (catálogo nacional MiCoche)
        VITE_REACT_APP_API_URL: /api
    container_name: mi-playa-public
    ports:
      - "3005:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - mi-playa-network

networks:
  mi-playa-network:
    driver: bridge

volumes:
  mi_playa_db_data:
  mi_playa_logs:
  mi_playa_uploads:
