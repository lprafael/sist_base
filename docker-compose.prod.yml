version: '3.8'

services:
  # --- Nginx Proxy Manager ---
  nginx-proxy:
    image: 'jc21/nginx-proxy-manager:latest'
    container_name: SIGEL-proxy
    restart: unless-stopped
    ports:
      - '80:80'   # HTTP público
      - '443:443' # HTTPS público
      - '81:81'   # Panel de control de Nginx (lo cerraremos después)
    volumes:
      - ./proxy/data:/data
      - ./proxy/letsencrypt:/etc/letsencrypt
    networks:
      - SIGEL-network

  # --- Base de Datos con PostGIS Integrado ---
  db:
    image: postgis/postgis:16-3.4-alpine
    container_name: SIGEL-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=admin
      - POSTGRES_DB=SIGEL
    ports:
      - "5434:5432"
    volumes:
      - sigel_db_data:/var/lib/postgresql/data
    networks:
      - SIGEL-network

  # --- Backend ---
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: sigel-backend:latest
    container_name: SIGEL-backend
    ports:
      - "8002:8001"
    depends_on:
      - db
    environment:
      - PORT=8001
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql+asyncpg://postgres:admin@db:5432/SIGEL
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/logs:/app/logs
      - ./backend/.env:/app/.env
    restart: unless-stopped
    networks:
      - SIGEL-network
    healthcheck:
      test: [ "CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8001/health\")'" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # --- Frontend ---
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_GOOGLE_CLIENT_ID=1052650611016-o42m62srbuc0o76r40tjg26ue1i9e4m9.apps.googleusercontent.com
        - VITE_REACT_APP_API_URL=/api
    image: sigel-frontend:latest
    container_name: SIGEL-frontend
    ports:
      - "3002:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - SIGEL-network
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/" ]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  SIGEL-network:
    driver: bridge

volumes:
  sigel_db_data:
