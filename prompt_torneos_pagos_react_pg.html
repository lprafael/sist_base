<script>
const secs = [
  {
    icon:"ti-stack",title:"Stack y contexto del proyecto",badge:"b-blue",bl:"Stack",
    new:false,
    body:`Stack tecnológico a usar:
- Frontend: React 18 + Vite + React Router v6 + Zustand (estado global) + React Query (server state)
- Backend: Node.js + Express + Prisma ORM
- Base de datos: PostgreSQL 16
- Autenticación: JWT (access token + refresh token)
- Pagos: MercadoPago (recomendado para Paraguay/Latinoamérica) con fallback a Stripe si se requiere tarjetas internacionales
- Almacenamiento de imágenes: Cloudinary (logos de equipos, fotos de jugadores)
- Emails: Nodemailer + plantillas HTML
- Documentación API: Swagger / OpenAPI 3.0

El sistema ya tiene un módulo de reservas de canchas funcionando. El nuevo módulo de torneos debe integrarse como un sub-sistema independiente que reutiliza: autenticación existente, tabla de canchas existente y tabla de usuarios existente.

Estructura de carpetas sugerida (monorepo):
/apps
  /web          → React frontend
  /api          → Node.js + Express backend
/packages
  /shared       → tipos TypeScript compartidos, utilidades`,
    tags:["react","node","postgresql","prisma","mercadopago"]
  },
  {
    icon:"ti-sitemap",title:"Modalidades de torneo",badge:"b-blue",bl:"Core",new:false,
    body:`Implementar las siguientes 4 modalidades, cada una como una clase/servicio independiente en el backend:

1. TODOS CONTRA TODOS — Liga / Round Robin
   - Cada equipo enfrenta a todos los demás (ida simple o ida+vuelta, configurable)
   - Puntos: victoria=3, empate=1, derrota=0
   - Tabla de posiciones con desempate configurable:
     1° diferencia de goles > 2° goles a favor > 3° enfrentamiento directo > 4° sorteo
   - Actualización automática de tabla al guardar resultado

2. FASE DE GRUPOS + ELIMINATORIAS
   - División en grupos (N equipos por grupo, configurable)
   - Round robin dentro de cada grupo
   - Clasificados por grupo pasan a eliminatoria (cantidad configurable: 1ro, 1ro+2do, etc.)
   - Cruces automáticos entre grupos (1ro grupo A vs 2do grupo B, etc.)
   - Fases eliminatorias: desde 32vos hasta la final + 3er/4to puesto
   - Ida y vuelta o partido único por fase (configurable)

3. ELIMINACIÓN DIRECTA — Bracket
   - Bracket tipo árbol, visualizable en el frontend como "llaves"
   - Soportar: 4, 8, 16, 32 equipos (con byes automáticos si no es potencia de 2 exacta)
   - Partido único o ida+vuelta (configurable por torneo)
   - Avance automático al cargar resultado
   - En empate de ida+vuelta: gol de visitante o penales (configurable)

4. SISTEMA SUIZO
   - N rondas predefinidas (configurable, típicamente log2 de equipos)
   - Ronda 1: emparejamiento aleatorio
   - Rondas siguientes: emparejamiento por puntaje similar (los líderes entre sí), evitando repetir cruces
   - Sin eliminación, todos juegan todas las rondas
   - Desempate final: puntos > Buchholz score (suma de puntos de rivales enfrentados)
   - Ideal para torneos de 1 día / muchos equipos`,
    tags:["modalidades","round-robin","bracket","suizo","grupos"]
  },
  {
    icon:"ti-credit-card",title:"Módulo de pagos — inscripciones",badge:"b-new",bl:"Nuevo",new:true,
    body:`CONFIGURACIÓN POR TORNEO:
- El administrador define si el torneo requiere pago de inscripción (puede ser gratuito)
- Monto de inscripción por equipo (en moneda local, configurable)
- Fecha límite de pago (inscripción válida solo si se paga antes de esa fecha)
- Política de reembolso: sin reembolso / reembolso parcial hasta X días / reembolso completo
- Descuento por pago anticipado (opcional): si paga antes de una fecha, aplica X% de descuento

PASARELA DE PAGO — MERCADOPAGO:
Integrar MercadoPago Checkout Pro (recomendado para Paraguay/Argentina/Latinoamérica):
- Backend: usar SDK oficial @mercadopago/sdk-node
- Crear preferencia de pago con los datos del torneo y equipo
- Redirect al Checkout Pro de MercadoPago
- Webhook para recibir notificaciones de pago en tiempo real
- Endpoint POST /api/pagos/webhook/mercadopago (debe ser público, sin JWT)
- Verificar firma del webhook con header x-signature

TAMBIÉN SOPORTAR STRIPE (para tarjetas internacionales):
- Backend: usar stripe npm package
- Payment Intents API con confirmación en frontend
- Stripe Elements en React para formulario de tarjeta seguro
- Webhook endpoint POST /api/pagos/webhook/stripe
- Verificar con stripe.webhooks.constructEvent()

TABLA DE PAGOS EN POSTGRESQL:
CREATE TABLE payments (
  id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
  tournament_team_id UUID REFERENCES tournament_teams(id),
  amount DECIMAL(10,2) NOT NULL,
  currency VARCHAR(3) DEFAULT 'ARS',
  provider VARCHAR(20) NOT NULL, -- 'mercadopago' | 'stripe' | 'manual'
  provider_payment_id VARCHAR(255),
  provider_preference_id VARCHAR(255),
  status VARCHAR(20) DEFAULT 'pending', -- pending|approved|rejected|refunded|cancelled
  paid_at TIMESTAMPTZ,
  refunded_at TIMESTAMPTZ,
  refund_amount DECIMAL(10,2),
  metadata JSONB,
  created_at TIMESTAMPTZ DEFAULT NOW(),
  updated_at TIMESTAMPTZ DEFAULT NOW()
);
CREATE INDEX ON payments(tournament_team_id);
CREATE INDEX ON payments(provider_payment_id);
CREATE INDEX ON payments(status);

ESTADOS DE INSCRIPCIÓN (flujo completo):
pending_payment → payment_processing → confirmed → rejected → refunded

LÓGICA DE NEGOCIO:
- Al crear inscripción: estado = pending_payment, se genera link de pago
- Al confirmar pago (webhook): estado = confirmed, equipo queda habilitado
- Si no paga antes de fecha límite: estado automático = cancelled (cron job diario)
- Solo equipos con estado = confirmed pueden participar en el sorteo
- Si se rechaza un pago, notificar al delegado y permitir reintentar

API ENDPOINTS DE PAGOS:
POST   /api/pagos/inscripcion/:torneoEquipoId   → generar preferencia/intent
GET    /api/pagos/estado/:torneoEquipoId         → consultar estado actual
POST   /api/pagos/webhook/mercadopago            → webhook MP (público)
POST   /api/pagos/webhook/stripe                 → webhook Stripe (público)
POST   /api/pagos/reembolso/:pagoId              → emitir reembolso (solo admin)
GET    /api/pagos/reporte/:torneoId              → reporte financiero del torneo

PANEL FINANCIERO DEL TORNEO (admin):
- Total recaudado vs total esperado
- Equipos con pago pendiente / confirmado / vencido
- Historial de transacciones con filtros
- Exportar reporte a CSV (equipos, monto pagado, fecha, método)
- Botón para enviar recordatorio de pago a los delegados morosos

PAGO MANUAL (efectivo):
- El admin puede marcar un pago como "pagado en efectivo"
- Requiere ingresar: monto recibido, fecha, nombre del responsable que recibió
- Genera un comprobante interno (no procesado por pasarela)

COMPROBANTE DE PAGO:
- Al confirmar pago, enviar email al delegado con comprobante en PDF
- El comprobante incluye: torneo, equipo, monto, fecha, número de transacción`,
    tags:["mercadopago","stripe","pagos","webhook","inscripción","reembolso"]
  },
  {
    icon:"ti-users",title:"Equipos, jugadores y lista de buena fe",badge:"b-blue",bl:"Core",new:false,
    body:`REGISTRO DE EQUIPO:
- Nombre, logo/escudo (upload a Cloudinary, max 2MB)
- Color principal y alternativo (color picker hex)
- Delegado: nombre, teléfono, email
- Categoría: libre / sub-20 / sub-17 / veteranos / femenino (configurable por torneo)
- Estado: activo / suspendido / retirado del torneo

LISTA DE BUENA FE:
- Cada equipo carga su plantilla antes del torneo
- Campos por jugador: nombre completo, DNI/CI, fecha de nacimiento, nro de camiseta, posición, foto (Cloudinary, opcional)
- Mín y máx de jugadores por torneo (configurable, ej: mín 11, máx 25)
- Fecha límite para modificar la lista (configurable por torneo)
- Al intentar modificar después de la fecha límite: solo el admin puede hacerlo
- Los jugadores inhabilitados por sanción se marcan automáticamente con un flag visible

VALIDACIONES IMPORTANTES:
- Un jugador (por DNI) no puede estar en dos equipos del mismo torneo
- El número de camiseta debe ser único dentro del equipo en ese torneo
- Si un equipo no tiene la lista completa al inicio del torneo, mostrar advertencia al admin

INSCRIPCIÓN:
- Un equipo puede participar en múltiples torneos simultáneamente
- Estado de inscripción: pending_payment / confirmed / rejected / withdrawn
- El campo de costo de inscripción se sincroniza con el módulo de pagos`,
    tags:["equipos","jugadores","lista buena fe","cloudinary","validaciones"]
  },
  {
    icon:"ti-arrows-shuffle",title:"Sorteo y fixture",badge:"b-blue",bl:"Core",new:false,
    body:`SORTEO ALEATORIO:
- Solo ejecutable cuando todos los equipos confirmados tienen estado = confirmed (pago aprobado)
- Algoritmo Fisher-Yates para aleatorización real
- Opción de cabezas de serie: los mejores equipos (indicados por admin) se separan en distintos grupos/ramas
- El sorteo puede ejecutarse una sola vez (con confirmación antes de ejecutar)
- Posibilidad de deshacer el sorteo y volver a sortear (solo si no hay partidos jugados aún)
- Guardar seed del sorteo para reproducibilidad/auditoría

GENERACIÓN DE FIXTURE:
Para Liga: algoritmo round-robin de Berger (genera calendario equilibrado)
Para Grupos + Elim: genera partidos de grupos, luego cruces automáticos al completar fase
Para Eliminatorias: genera bracket completo con byes si es necesario
Para Suizo: genera solo la primera ronda; las siguientes se generan automáticamente al terminar cada ronda

ASIGNACIÓN DE CANCHA Y HORARIO:
- Integración con el módulo de reservas existente
- Al generar fixture: reserva automática de canchas según disponibilidad
- Si no hay cancha disponible: dejar sin asignar y alertar al admin
- Posibilidad de asignar/cambiar cancha y horario manualmente
- Historial de cambios de programación (quién cambió, cuándo, motivo)

EXPORTACIÓN Y COMPARTIR:
- Fixture completo exportable como PDF (usar react-pdf o puppeteer en backend)
- Link público por torneo: /t/[slug-del-torneo] (sin login requerido)
- Compartir fixture por WhatsApp: URL pre-construida con mensaje y link`,
    tags:["sorteo","fixture","round-robin","berger","reservas","PDF"]
  },
  {
    icon:"ti-ball-football",title:"Resultados y estadísticas",badge:"b-blue",bl:"Core",new:false,
    body:`RESULTADO DE PARTIDO — API:
PATCH /api/partidos/:id/resultado
Body: { golesLocal, golesVisitante, estado, arbitro, penalesLocal?, penalesVisitante?, observaciones }

Estados válidos: scheduled | in_progress | finished | suspended | postponed | walkover

REGISTRO DE GOLES (endpoint separado):
POST /api/partidos/:id/goles
Body: { jugadorId, equipoId, minuto, tipo: 'normal'|'penal'|'autogol'|'cabeza' }
DELETE /api/partidos/:id/goles/:golId  → corregir error de carga

Los autogoles: se suman a los goles del equipo rival, se restan de la valla del arquero rival.
Un jugador puede registrar múltiples goles en el mismo partido (hat-trick, etc.).

VALLA MENOS VENCIDA:
- Registrar arquero titular por partido y equipo: POST /api/partidos/:id/arquero
- Calcular: PJ (partidos jugados), GC (goles concedidos), VI (vallas invictas), promedio GC/PJ
- Ranking de arqueros del torneo por promedio GC/PJ (menor es mejor)

ESTADÍSTICAS DEL TORNEO (calculadas en PostgreSQL con views/materialized views):
- Tabla de posiciones (PJ, PG, PE, PP, GF, GC, DG, PTS) — actualizar al guardar cada resultado
- Top goleadores (jugador, equipo, goles, asistencias opcionales)
- Top arqueros (valla menos vencida)
- Datos del torneo: total de goles, promedio goles/partido, partido más goleador
- Historial completo por equipo: todos los torneos en que participó

CORRECCIONES:
- El admin puede corregir un resultado cargado (con log de quién lo corrigió y cuándo)
- Al corregir resultado: recalcular tabla de posiciones automáticamente`,
    tags:["goles","resultados","estadísticas","views","postgresql","valla"]
  },
  {
    icon:"ti-card-card",title:"Tarjetas y sanciones",badge:"b-blue",bl:"Core",new:false,
    body:`REGISTRO DE TARJETAS:
POST /api/partidos/:id/tarjetas
Body: { jugadorId, equipoId, minuto, tipo: 'yellow'|'red'|'second_yellow' }

Segunda amarilla en el mismo partido → el sistema la convierte automáticamente en roja y actualiza el conteo.

CONFIGURACIÓN DE SANCIONES (por torneo, en tabla tournament_config):
{
  "yellowsForSuspension": 3,          // cada N amarillas = 1 partido suspendido
  "redDirectSuspension": 1,           // partidos de suspensión por roja directa
  "redAccumulatedSuspension": 1,      // partidos por segunda amarilla = roja
  "suspensionEnabled": true,          // si false, solo registra sin penalizar
  "canAppeal": true                   // si se permiten apelaciones
}

LÓGICA DE SANCIONES (ejecutar al guardar una tarjeta):
1. Verificar si el jugador llegó al límite de amarillas → crear sanción automática
2. Si recibió roja → crear sanción automática con partidos configurados
3. Marcar al jugador como suspended=true para el/los siguiente/s partido/s
4. Al iniciar carga de planilla de un partido: verificar que ningún jugador esté suspendido

SANCIONES MANUALES (admin):
- Agregar sanción extra con descripción, gravedad (leve/grave/muy grave) y N partidos
- Ejemplo: incidente fuera de cancha, agresión a árbitro, etc.

APELACIONES:
POST /api/sanciones/:id/apelar
Body: { motivo, documentacion (texto libre) }
El admin puede aprobar (reducir/eliminar sanción) o rechazar la apelación.
Notificar al delegado el resultado.

PANEL DE SANCIONES (frontend admin):
- Lista de jugadores sancionados activos con contador de partidos restantes
- Jugadores "en el límite" (próxima tarjeta = suspensión automática)
- Historial completo: tarjetas por jugador, por partido, por equipo
- Fair play ranking: equipos ordenados por menor cantidad de tarjetas
- Premio fair play al final del torneo (campo en Tournament, asignable por admin)`,
    tags:["tarjetas","sanciones","apelaciones","fair-play","suspensión"]
  },
  {
    icon:"ti-layout-dashboard",title:"Frontend React — componentes clave",badge:"b-purple",bl:"React",new:false,
    body:`ARQUITECTURA FRONTEND:
- React 18 + Vite + TypeScript
- Routing: React Router v6 (rutas públicas y privadas)
- Estado global: Zustand (sesión, torneo activo)
- Server state: React Query / TanStack Query (cache + invalidación)
- Formularios: React Hook Form + Zod (validación)
- UI Components: shadcn/ui o Radix UI (accesibles, sin estilos forzados)
- Tablas: TanStack Table v8
- Gráficos/Bracket: react-flow o custom SVG para el bracket visual
- Exportar PDF: react-pdf/renderer o jsPDF

PÁGINAS PÚBLICAS (sin login) → /t/:slug:
- TournamentPage: vista general, próximos partidos, últimos resultados
- FixturePage: todos los partidos organizados por fecha/ronda
- StandingsPage: tabla de posiciones (liga) o bracket (eliminatorias)
- ScorersPage: tabla de goleadores y arqueros
- TeamPage: detalle de un equipo con su plantilla y estadísticas

PÁGINAS ADMIN (con login) → /admin:
- Dashboard: métricas rápidas, partidos del día, alertas
- TournamentForm: crear/editar torneo con todos sus parámetros
- TeamsManager: gestión de inscripciones, validar listas de buena fe
- DrawPage: ejecutar sorteo con animación y vista de resultado
- FixtureManager: ver y editar el fixture, asignar canchas/horarios
- MatchForm: carga rápida de resultado, goles, tarjetas (optimizado para móvil)
- SanctionsPanel: gestión de sanciones y apelaciones
- PaymentsPanel: estado de pagos, enviar recordatorios, marcar pagos manuales
- ReportsPage: exportar fixtures, estadísticas, reporte financiero en PDF/CSV

COMPONENTE BRACKET VISUAL:
- Árbol de eliminatorias interactivo
- Cada nodo = partido con equipos, resultado, estado
- Responsive: en móvil se visualiza scrolleable horizontalmente
- Los partidos avanzan automáticamente (React Query revalida cada 30s en tiempo de torneo)

CHECKOUT DE INSCRIPCIÓN:
- Si el torneo requiere pago: al confirmar inscripción mostrar resumen + botón de pago
- Para MercadoPago: redirigir a Checkout Pro (URL generada por backend)
- Para Stripe: mostrar Stripe Elements en modal (sin salir de la app)
- Página de retorno: /inscripcion/resultado?status=approved|rejected|pending
- Mostrar comprobante o mensaje de error con opción de reintentar`,
    tags:["react","tanstack-query","react-hook-form","bracket","shadcn","stripe-elements"]
  },
  {
    icon:"ti-database",title:"Schema PostgreSQL completo",badge:"b-amber",bl:"DB",new:false,
    body:`-- Usar UUID como PK en todas las tablas
-- Habilitar extensión: CREATE EXTENSION IF NOT EXISTS "pgcrypto";

CREATE TABLE tournaments (
  id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
  venue_id UUID REFERENCES venues(id),       -- complejo deportivo
  name VARCHAR(255) NOT NULL,
  slug VARCHAR(255) UNIQUE NOT NULL,         -- para URL pública
  sport VARCHAR(50) DEFAULT 'football',
  modality VARCHAR(20) NOT NULL,             -- league|groups_knockout|knockout|swiss
  status VARCHAR(20) DEFAULT 'draft',        -- draft|open|in_progress|finished|cancelled
  start_date DATE,
  end_date DATE,
  registration_deadline TIMESTAMPTZ,
  payment_required BOOLEAN DEFAULT false,
  registration_fee DECIMAL(10,2) DEFAULT 0,
  currency VARCHAR(3) DEFAULT 'ARS',
  early_payment_discount DECIMAL(5,2) DEFAULT 0,
  early_payment_deadline TIMESTAMPTZ,
  refund_policy VARCHAR(20) DEFAULT 'none',  -- none|partial|full
  min_players INT DEFAULT 11,
  max_players INT DEFAULT 25,
  roster_lock_date TIMESTAMPTZ,
  config JSONB DEFAULT '{}',                 -- reglas del torneo (sanciones, etc.)
  fair_play_winner_id UUID,
  created_by UUID REFERENCES users(id),
  created_at TIMESTAMPTZ DEFAULT NOW(),
  updated_at TIMESTAMPTZ DEFAULT NOW()
);

CREATE TABLE tournament_teams (
  id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
  tournament_id UUID REFERENCES tournaments(id) ON DELETE CASCADE,
  team_id UUID REFERENCES teams(id),
  group_letter VARCHAR(2),                   -- A, B, C... (para modalidad grupos)
  seed INT,                                  -- cabeza de serie (1, 2, etc.)
  status VARCHAR(20) DEFAULT 'pending_payment',
  withdrawn_at TIMESTAMPTZ,
  created_at TIMESTAMPTZ DEFAULT NOW()
);

CREATE TABLE payments (
  id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
  tournament_team_id UUID REFERENCES tournament_teams(id),
  amount DECIMAL(10,2) NOT NULL,
  currency VARCHAR(3) DEFAULT 'ARS',
  provider VARCHAR(20) NOT NULL,             -- mercadopago|stripe|cash
  provider_payment_id VARCHAR(255),
  provider_preference_id VARCHAR(255),
  status VARCHAR(20) DEFAULT 'pending',      -- pending|approved|rejected|refunded|cancelled
  paid_at TIMESTAMPTZ,
  refunded_at TIMESTAMPTZ,
  refund_amount DECIMAL(10,2),
  received_by VARCHAR(255),                  -- para pagos en efectivo
  metadata JSONB,
  created_at TIMESTAMPTZ DEFAULT NOW(),
  updated_at TIMESTAMPTZ DEFAULT NOW()
);
CREATE INDEX ON payments(tournament_team_id);
CREATE INDEX ON payments(provider_payment_id);
CREATE INDEX ON payments(status);

CREATE TABLE matches (
  id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
  tournament_id UUID REFERENCES tournaments(id),
  phase VARCHAR(30) NOT NULL,                -- groups|r32|r16|quarters|semis|third|final
  round INT,
  group_letter VARCHAR(2),
  home_team_id UUID REFERENCES tournament_teams(id),
  away_team_id UUID REFERENCES tournament_teams(id),
  field_id UUID REFERENCES fields(id),       -- cancha del complejo
  booking_id UUID,                           -- reserva en módulo existente
  scheduled_at TIMESTAMPTZ,
  started_at TIMESTAMPTZ,
  finished_at TIMESTAMPTZ,
  home_goals INT DEFAULT 0,
  away_goals INT DEFAULT 0,
  home_penalties INT,
  away_penalties INT,
  status VARCHAR(20) DEFAULT 'scheduled',
  referee VARCHAR(255),
  notes TEXT,
  created_by UUID REFERENCES users(id),
  created_at TIMESTAMPTZ DEFAULT NOW(),
  updated_at TIMESTAMPTZ DEFAULT NOW()
);

CREATE TABLE goals (
  id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
  match_id UUID REFERENCES matches(id) ON DELETE CASCADE,
  tournament_player_id UUID REFERENCES tournament_players(id),
  team_id UUID REFERENCES tournament_teams(id),
  minute INT,
  type VARCHAR(20) DEFAULT 'normal',         -- normal|penalty|own_goal|header
  created_at TIMESTAMPTZ DEFAULT NOW()
);

CREATE TABLE cards (
  id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
  match_id UUID REFERENCES matches(id) ON DELETE CASCADE,
  tournament_player_id UUID REFERENCES tournament_players(id),
  team_id UUID REFERENCES tournament_teams(id),
  minute INT,
  type VARCHAR(20) NOT NULL,                 -- yellow|red|second_yellow
  created_at TIMESTAMPTZ DEFAULT NOW()
);

CREATE TABLE sanctions (
  id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
  tournament_player_id UUID REFERENCES tournament_players(id),
  tournament_id UUID REFERENCES tournaments(id),
  card_id UUID REFERENCES cards(id),         -- null si es sanción manual
  reason TEXT NOT NULL,
  severity VARCHAR(20) DEFAULT 'mild',       -- mild|serious|very_serious
  matches_suspended INT NOT NULL DEFAULT 1,
  matches_served INT DEFAULT 0,
  status VARCHAR(20) DEFAULT 'active',       -- active|served|appealing|overturned
  appeal_reason TEXT,
  appeal_resolved_at TIMESTAMPTZ,
  appeal_resolved_by UUID REFERENCES users(id),
  created_by UUID REFERENCES users(id),
  created_at TIMESTAMPTZ DEFAULT NOW()
);

-- Vista materializada para tabla de posiciones (refrescar al cargar cada resultado):
CREATE MATERIALIZED VIEW standings AS
SELECT
  tt.tournament_id, tt.id AS tournament_team_id, tt.group_letter,
  t.name AS team_name,
  COUNT(m.id) AS played,
  COUNT(CASE WHEN (m.home_team_id = tt.id AND m.home_goals > m.away_goals) OR
                  (m.away_team_id = tt.id AND m.away_goals > m.home_goals) THEN 1 END) AS won,
  COUNT(CASE WHEN m.home_goals = m.away_goals THEN 1 END) AS drawn,
  COUNT(CASE WHEN (m.home_team_id = tt.id AND m.home_goals < m.away_goals) OR
                  (m.away_team_id = tt.id AND m.away_goals < m.home_goals) THEN 1 END) AS lost,
  SUM(CASE WHEN m.home_team_id = tt.id THEN m.home_goals ELSE m.away_goals END) AS goals_for,
  SUM(CASE WHEN m.home_team_id = tt.id THEN m.away_goals ELSE m.home_goals END) AS goals_against,
  (COUNT(CASE WHEN ... THEN 1 END) * 3 + COUNT(CASE WHEN m.home_goals = m.away_goals THEN 1 END)) AS points
FROM tournament_teams tt
JOIN teams t ON t.id = tt.team_id
LEFT JOIN matches m ON (m.home_team_id = tt.id OR m.away_team_id = tt.id) AND m.status = 'finished'
GROUP BY tt.tournament_id, tt.id, tt.group_letter, t.name;`,
